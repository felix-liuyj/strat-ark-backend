# StratArk 策舟 · 全栈编排 base（PostgreSQL + Redis + 后端 + 前端）
# 编排文件随后端仓库管理，须在 strat-ark-backend/ 目录执行；前端经 ../strat-ark-frontend 构建。
# 本地开发：docker compose up -d --build
#           （仅 base；引擎 / AI 网关连接走管理员在引擎管理页的配置，未配置则对应能力不可用）
# 生产编排：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#           （叠加 Freqtrade 编排器 + TradingAgents API 服务，敏感值走 .env，模板见 .env.compose.example）
# 种子数据：docker compose exec backend python -m scripts.seed
# 访问：前端 http://localhost:3000 · 后端文档 http://localhost:8000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-strat_ark}
    ports:
      - "127.0.0.1:5432:5432"   # 仅本机可达；服务间通过网络名 postgres 连接
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-strat_ark}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [stratark]

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # 仅本机可达
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [stratark]

  backend:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-docker}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-strat_ark}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ADMIN_EMAIL_SUFFIXES: ${ADMIN_EMAIL_SUFFIXES:-stratark.io}
      ENCRYPT_KEY: ${ENCRYPT_KEY:-}
      # Stripe 订阅支付：留空即未启用；付费套餐切换会明确失败，不做本地付费回退
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Checkout / Portal 回跳基址，留空取首个 CORS origin
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      # SMTP（注册 / 重置密码验证码邮件）：留空时发码接口返回明确错误
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      # OAuth 登录（Google / Microsoft）：留空即隐藏对应登录入口
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-common}
      # 阿里云 OSS（文件上传 / 邮件 logo）：留空即未启用
      ALI_OSS_ACCESS_KEY: ${ALI_OSS_ACCESS_KEY:-}
      ALI_OSS_ACCESS_SECRET: ${ALI_OSS_ACCESS_SECRET:-}
      ALI_OSS_REGION: ${ALI_OSS_REGION:-}
      ALI_OSS_BUCKET_NAME: ${ALI_OSS_BUCKET_NAME:-}
      BRAND_LOGO_OSS_PATH: ${BRAND_LOGO_OSS_PATH:-}
      # AI 投研 LLM 网关不走 env：管理员在引擎管理页配置（落库为单一事实源）
      # 行情 / 交易所 REST 基址：默认 Binance 公共端点，可覆盖为自建代理
      MARKET_DATA_REST_URL: ${MARKET_DATA_REST_URL:-https://api.binance.com}
      MARKET_DATA_WS_URL: ${MARKET_DATA_WS_URL:-}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      EXCHANGE_API_BASE: ${EXCHANGE_API_BASE:-https://api.binance.com}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [stratark]

  frontend:
    build:
      context: ../strat-ark-frontend
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-策舟 StratArk · AI Crypto Trading Platform}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_DEFAULT_LANG: ${VITE_DEFAULT_LANG:-zh}
        VITE_DEFAULT_THEME: ${VITE_DEFAULT_THEME:-dark}
        # OAuth 公开 client_id（public PKCE）：留空即隐藏对应登录按钮
        VITE_OAUTH_GOOGLE_CLIENT_ID: ${VITE_OAUTH_GOOGLE_CLIENT_ID:-}
        VITE_OAUTH_MICROSOFT_CLIENT_ID: ${VITE_OAUTH_MICROSOFT_CLIENT_ID:-}
        VITE_OAUTH_MICROSOFT_TENANT: ${VITE_OAUTH_MICROSOFT_TENANT:-common}
        VITE_OAUTH_REDIRECT_URI: ${VITE_OAUTH_REDIRECT_URI:-}
    environment:
      # 运行时覆写 API 基址（容器启动写 runtime-config.js），换环境无需重建镜像
      API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:8080"   # 非 root nginx（unprivileged）监听 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - backend
    networks: [stratark]

volumes:
  pgdata:

networks:
  stratark:
    driver: bridge
    # 固定名称：与 engines 编排一致，bot 实例容器经 docker API 按名加入本网络
    name: stratark
