# StratArk 策舟 · Freqtrade 编排服务（per-bot 实例容器编排）
# 单独启动：docker compose -f docker-compose.engines.yml up -d
# 作为生产全栈一部分：由 docker-compose.prod.yml 通过 include 自动引入。
#
# 架构：不再预置单一 freqtrade 容器；由 orchestrator（独占 docker.sock）按 backend
# 下发的规格为每个 bot 创建独立 freqtrade 实例容器（dry_run / live 由 env 注入，
# 交易所凭证仅经容器环境变量传递、不落盘）。实例共享只读 user_data 卷（基础 config
# + 内置策略），由 orchestrator 启动时初始化。
#
# 必填环境变量：ORCHESTRATOR_TOKEN（backend 引擎管理页连接配置中填同一值）
# 可选：FREQTRADE_IMAGE（实例默认镜像，生产建议钉死 digest）

services:
  freqtrade-orchestrator:
    build:
      context: ./engines
      dockerfile: freqtrade-orchestrator/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?必须设置 ORCHESTRATOR_TOKEN（编排控制面鉴权）}
      INSTANCE_IMAGE: ${FREQTRADE_IMAGE:-freqtradeorg/freqtrade:stable}
      INSTANCE_NETWORK: stratark
      USERDATA_VOLUME: freqtrade_userdata
    volumes:
      # 编排器独占 docker.sock：backend 不直连 Docker，权限隔离在本服务
      - /var/run/docker.sock:/var/run/docker.sock
      - freqtrade_userdata:/userdata
    tmpfs:
      - /tmp
    expose:
      - "8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health').status==200 else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 100
    networks: [stratark]

volumes:
  freqtrade_userdata:
    # 固定名称：实例容器经 docker API 按名挂载，不能带 compose 项目前缀
    name: freqtrade_userdata

networks:
  stratark:
    driver: bridge
    # 固定名称：实例容器经 docker API 按名加入，backend 与实例同网互通
    name: stratark
