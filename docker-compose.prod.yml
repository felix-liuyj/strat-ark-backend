# StratArk 策舟 · 生产编排 override（主栈生产化 + Freqtrade 引擎 + TradingAgents API 服务）
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   Freqtrade 定义在 docker-compose.engines.yml，本文件通过 include 自动引入（无需再手动 -f）。
#   TradingAgents 直接作为 API 服务部署在本文件，不再出现在 compose engine 中。
# 前置：同目录 .env 提供生产密钥（标 `:?` 的变量缺失会直接报错，避免误用开发默认值）：
#   POSTGRES_PASSWORD / REDIS_PASSWORD / JWT_SECRET_KEY / ENCRYPT_KEY
#   LLM_API_KEY / VITE_API_BASE_URL / ORCHESTRATOR_TOKEN
#   可选：FREQTRADE_IMAGE / TRADINGAGENTS_API_IMAGE / LLM_GATEWAY_URL
#   可选（启用 Stripe 收费时必填）：STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / FRONTEND_BASE_URL
include:
  - docker-compose.engines.yml

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产必须在 .env 设置 POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    restart: unless-stopped
    # 生产开启密码与 AOF 持久化
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?生产必须在 .env 设置 REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?生产必须在 .env 设置 JWT_SECRET_KEY}
      ENCRYPT_KEY: ${ENCRYPT_KEY:?生产必须在 .env 设置 ENCRYPT_KEY}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Stripe 订阅支付（生产启用收费时必填两项；留空则订阅走本地模拟、不发起真实扣费）
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Checkout / Portal 回跳的前端公网基址，留空取首个 CORS origin
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 引擎/API 健康依赖运维预置配置 / 镜像，先不阻塞后端启动；待稳定可改为 service_healthy
      freqtrade-orchestrator:
        condition: service_started
      tradingagents-api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    restart: unless-stopped
    build:
      context: ../strat-ark-frontend
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-策舟 StratArk · AI Crypto Trading Platform}
        # 浏览器侧访问的 API 公网地址，生产必须显式设置；
        # 构建期注入兜底 + 运行时（environment.API_BASE_URL）覆写，换环境只需重启容器
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?生产必须在 .env 设置 VITE_API_BASE_URL}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_DEFAULT_LANG: ${VITE_DEFAULT_LANG:-zh}
        VITE_DEFAULT_THEME: ${VITE_DEFAULT_THEME:-dark}
        # OAuth 公开 client_id（public PKCE）：留空即隐藏对应登录按钮
        VITE_OAUTH_GOOGLE_CLIENT_ID: ${VITE_OAUTH_GOOGLE_CLIENT_ID:-}
        VITE_OAUTH_MICROSOFT_CLIENT_ID: ${VITE_OAUTH_MICROSOFT_CLIENT_ID:-}
        VITE_OAUTH_MICROSOFT_TENANT: ${VITE_OAUTH_MICROSOFT_TENANT:-common}
        VITE_OAUTH_REDIRECT_URI: ${VITE_OAUTH_REDIRECT_URI:-}
    environment:
      API_BASE_URL: ${VITE_API_BASE_URL:?生产必须在 .env 设置 VITE_API_BASE_URL}

  tradingagents-api:
    image: ${TRADINGAGENTS_API_IMAGE:-stratark/tradingagents-api:latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pull_policy: always
    environment:
      SERVICE_PORT: "8100"
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:?生产必须在 .env 设置 LLM_API_KEY}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-claude-sonnet}
    tmpfs:
      - /tmp
    expose:
      - "8100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [stratark]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 200
        reservations:
          cpus: "0.5"
          memory: 512m

volumes:
  redisdata:
